name: Build and Deploy Static Site
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
# Add explicit permissions
permissions:
  contents: write
  packages: write
  id-token: write
# Allow one concurrent deployment
concurrency:
  group: 'deploy-static-site-${{ github.ref }}'
  cancel-in-progress: true
env:
  S3_BUCKET_NAME: 'emomtimer-us-east-1-504242000181'
  AWS_REGION: 'us-east-1'
  SITE_URL: 'https://emomtimer.2ad.com'
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::504242000181:role/GithubDeployCI
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Trunk and Wasm
        run: |
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

          if ! command -v trunk >/dev/null 2>&1; then
            cargo install trunk --locked
          fi

          if ! command -v wasm-bindgen >/dev/null 2>&1; then
            cargo install wasm-bindgen-cli --locked
          fi

          trunk --version
          wasm-bindgen --version
      - name: Rust Build and Check
        run: |
          cargo fmt --check
          cargo clippy --all-features --no-deps
          cargo test
      - name: Build Artifact
        run: |
          trunk build --release --public-url ${{ env.SITE_URL }}
      - name: Deploy infrastructure
        run: bun run cdk:deploy StackEmomTimer2adCom --require-approval never --no-telemetry
      - name: Sync S3 Bucket
        run: |
          aws s3 sync ./dist s3://${S3_BUCKET_NAME} --delete --region ${{ env.AWS_REGION }}
      - name: Set HTML no-cache headers
        run: |
          aws s3 cp ./dist/index.html s3://${S3_BUCKET_NAME}/index.html \
            --region ${{ env.AWS_REGION }} \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"
      - name: Invalidate CloudFront cache
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.md
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
